{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <div>
        <h2>Динамика СПП в процентах от цены в ЛК</h2>
        <p>{{ product.product_name }} • SKU: {{ product.sku }}</p>
    </div>
    <a href="/price-monitor/" class="secondary-button">Назад к мониторингу</a>
</section>

<section class="card">
    <div class="section-head">
        <div>
            <h2>{{ product.product_name }}</h2>
            <p>График процента от цены в ЛК для линий СПП С КАРТОЙ и СПП.</p>
        </div>
    </div>
    <canvas id="priceHistoryChart" height="120"></canvas>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const chartLabels = {{ chart_labels | tojson }};
    const chartPercentWithSpp = {{ chart_percent_with_spp | tojson }};
    const chartPercentWithoutSpp = {{ chart_percent_without_spp | tojson }};

    const ctx = document.getElementById("priceHistoryChart");

    new Chart(ctx, {
        type: "line",
        data: {
            labels: chartLabels,
            datasets: [
                {
                    label: "СПП С КАРТОЙ, %",
                    data: chartPercentWithSpp,
                    borderColor: "#22C55E",
                    backgroundColor: "rgba(34, 197, 94, 0.15)",
                    tension: 0.25,
                    spanGaps: true
                },
                {
                    label: "СПП, %",
                    data: chartPercentWithoutSpp,
                    borderColor: "#64748B",
                    backgroundColor: "rgba(100, 116, 139, 0.12)",
                    tension: 0.25,
                    spanGaps: true
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            interaction: {
                mode: "index",
                intersect: false
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const label = context.dataset.label || "";
                            const value = context.parsed.y;
                            if (value === null || value === undefined) {
                                return label + ": -";
                            }
                            return label + ": " + value + "%";
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: false,
                    ticks: {
                        callback: function(value) {
                            return value + "%";
                        }
                    }
                }
            }
        }
    });
</script>
{% endblock %}
